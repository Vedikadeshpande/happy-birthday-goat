    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #1c120a;
            font-family: 'Quicksand', sans-serif;
        }

        /* =========================================================
           BACK BUTTON
        ========================================================= */
        .back-btn {
            position: fixed;
            top: 16px; left: 16px;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            background:#BB9672;
            color: #ffff;
            border: none;
            padding: 9px 18px;
            border-radius: 50px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 3px 14px rgba(0,0,0,0.3);
            transition: all 0.25s ease;
        }
        .back-btn:hover {
            background: #ff758f;
            color: #fff;
            transform: translateX(-3px);
        }

        /* =========================================================
           COVER SCREEN
        ========================================================= */
        #cover-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1),
                        opacity 0.8s ease 0.4s;
            transform-origin: left center;
            perspective: 2500px;
        }

        /* Swoosh away: book cover opens */
        #cover-screen.swoosh-away {
            transform: rotateY(-110deg);
            opacity: 0;
            pointer-events: none;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
        }

        /* Gradient overlay so button is readable */
        .cover-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                transparent 40%,
                rgba(0,0,0,0.55) 100%
            );
        }

        .tap-to-open-btn {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #BB9672;
            color: #ffff;
            border: none;
            padding: 12px 28px; /* Reduced from 16px 40px */
            border-radius: 60px;
            font-family: 'ComicCat', serif;
            font-size: 1rem; /* Reduced from 1.2rem */
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
            white-space: nowrap;
            letter-spacing: 0.5px;
            animation: gentlePulse 2.2s ease-in-out infinite;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* =========================================================
           NOTEBOOK SCREEN  (hidden until cover swooshes away)
        ========================================================= */
        #notebook-screen {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #3a2510 0%, #1c120a 100%);

            /* Starts hidden below  */
            opacity: 0;
            transform: scale(0.92) translateY(40px);
            transition: opacity 0.6s ease 0.55s,
                        transform 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.55s;
            pointer-events: none;
        }
        #notebook-screen.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* ---- NAV ARROWS ---- */
        .nb-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.88);
            border: none;
            font-size: 1.15rem;
            color: #6a3800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            transition: all 0.22s ease;
        }
        .nb-arrow:hover {
            background: #ff758f;
            color: #fff;
            transform: translateY(-50%) scale(1.12);
        }
        .nb-arrow:disabled {
            opacity: 0.18;
            pointer-events: none;
        }
        .nb-arrow.prev { left: 14px; }
        .nb-arrow.next { right: 14px; }

        @media (min-width: 720px) {
            .nb-arrow.prev { left: 28px; }
            .nb-arrow.next { right: 28px; }
        }

        /* ---- PAGE COUNTER ---- */
        .page-counter {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            color: rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.28);
            padding: 4px 16px;
            border-radius: 50px;
            pointer-events: none;
            letter-spacing: 1px;
        }

        /* =========================================================
           THE NOTEBOOK BOOK
        ========================================================= */
        .notebook-wrap {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 80px;
        }

        .notebook {
            position: relative;
            width: 100%;
            max-width: 660px;
            height: min(86vh, 800px);
            display: flex;
            border-radius: 8px;
            box-shadow: 0 14px 60px rgba(0,0,0,0.65), 0  4px 14px rgba(0,0,0,0.4);
            overflow: hidden;
            background: url('images/digital notes page.jpg') center/100% 100% no-repeat;
        }

        /* ---- PAGES CONTAINER ---- */
        .pages-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: transparent;
            perspective: 2500px;
        }

        /* Notebook paper lines + red margin */
        .page {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            background: transparent;

            /* Page turn: hinge on left, open to right */
            transform-origin: left center;
            transform: rotateY(90deg);
            transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            transform: rotateY(0deg);
        }

        .page.exit-left {
            opacity: 0;
            transform: rotateY(-90deg);
        }

        /* Subtle scrollbar */
        .page::-webkit-scrollbar { width: 5px; }
        .page::-webkit-scrollbar-track { background: transparent; }
        .page::-webkit-scrollbar-thumb {
            background: rgba(180, 120, 50, 0.28);
            border-radius: 10px;
        }

        /* ---- PAGE CONTENT ---- */
        .page-content {
            padding: 50px 40px 50px 50px;
            line-height: 32px;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .p-from {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: #8b3a10;
            line-height: 32px;
        }

        .p-date {
            font-family: 'Quicksand', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            color: #c0a080;
            line-height: 32px;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .p-body {
            font-family: 'Kalam', cursive;
            font-size: 1.52rem;
            line-height: 32px;
            color: #1e1208;
            white-space: pre-line;
            margin-bottom: 12px;
        }

        .p-sig {
            font-family: 'Kalam', cursive;
            font-size: 1.42rem;
            font-weight: 700;
            color: #8b3a10;
            line-height: 32px;
        }

        .p-doodle {
            font-family: 'Kalam', cursive;
            font-size: 1.1rem;
            letter-spacing: 7px;
            color: #c04060;
            opacity: 0.45;
            line-height: 32px;
        }

        .p-divider {
            text-align: center;
            letter-spacing: 10px;
            font-size: 0.78rem;
            color: #c0a060;
            opacity: 0.4;
            line-height: 32px;
            margin: 2px 0;
        }

        .p-spacer { line-height: 32px; display: block; }

        .p-closing {
            margin-top: 28px;
            text-align: center;
            font-family: 'Kalam', cursive;
            font-size: 1.15rem;
            color: #8a5020;
            opacity: 0.6;
            line-height: 32px;
        }

        /* =========================================================
           MOBILE
        ========================================================= */
        @media (max-width: 600px) {
            .notebook-wrap { padding: 12px 24px; }

            .notebook {
                max-width: 100%;
                height: min(91vh, 700px);
                border-radius: 8px;
            }

            .page-content {
                padding: 40px 20px 40px 24px;
                line-height: 30px;
            }

            .page {
                background: transparent;
            }

            .p-body { font-size: 1.28rem; line-height: 30px; }
            .p-from, .p-date, .p-sig, .p-doodle,
            .p-divider, .p-closing { line-height: 30px; }

            .nb-arrow       { width: 40px; height: 40px; font-size: 1rem; }
            .nb-arrow.prev  { left: 6px; }
            .nb-arrow.next  { right: 6px; }

            .tap-to-open-btn { font-size: 1.05rem; padding: 14px 28px; }
            .back-btn { font-size: 0.82rem; padding: 8px 14px; }
        }
    </style>

        let TOTAL = NOTES.length;
        let current = 1;

        // Auto-generate HTML pages from the NOTES array
        function renderNotes() {
            const container = document.getElementById('pages-container');
            container.innerHTML = '';
            
            NOTES.forEach((note, index) => {
                const pageNum = index + 1;
                const isActive = pageNum === 1 ? 'active' : '';
                
                let contentHTML = ``;
                if (note.from) contentHTML += `<div class="p-from">${note.from}</div>`;
                if (note.date) contentHTML += `<div class="p-date">${note.date}</div>`;
                if (note.text) contentHTML += `<p class="p-body">${note.text}</p>`;
                if (note.sig) contentHTML += `<div class="p-sig">${note.sig}</div>`;
                if (note.doodle) contentHTML += `<div class="p-doodle">${note.doodle}</div>`;
                if (note.divider) contentHTML += `<div class="p-divider">${note.divider}</div>`;
                if (note.closing) contentHTML += `<div class="p-closing">${note.closing}</div>`;

                container.innerHTML += `
                    <div class="page ${isActive}" data-p="${pageNum}">
                        <div class="page-content">
                            ${contentHTML}
                        </div>
                    </div>
                `;
            });
            
            TOTAL = NOTES.length;
            updateUI();
        }

        // Run on load
        document.addEventListener('DOMContentLoaded', renderNotes);

        /* ---- OPEN BOOK with swoosh ---- */
        function openBook() {
            // Disable button to prevent double-tap
            document.getElementById('tap-btn').disabled = true;

            // Swoosh the cover away
            document.getElementById('cover-screen').classList.add('swoosh-away');

            // Reveal notebook after a short delay (matches transition timing)
            setTimeout(() => {
                document.getElementById('notebook-screen').classList.add('visible');
            }, 300);
        }

        /* ---- PAGE NAVIGATION ---- */
        function goTo(num) {
            const pages = document.querySelectorAll('.page');

            // Mark current as exiting
            const currentEl = document.querySelector(`.page[data-p="${current}"]`);
            if (currentEl) {
                currentEl.classList.remove('active');
                if (num > current) {
                    currentEl.classList.add('exit-left');
                } else {
                    // Going backwards: exit to the right
                    currentEl.style.transform = 'rotateY(90deg)';
                    currentEl.style.opacity = '0';
                }
            }

            // After transition, activate new page
            setTimeout(() => {
                // Reset all pages
                pages.forEach(p => {
                    p.classList.remove('active', 'exit-left');
                    p.style.transform = '';
                    p.style.opacity = '';
                });

                const next = document.querySelector(`.page[data-p="${num}"]`);
                if (next) {
                    // Flip in from correct direction
                    if (num > current) {
                        next.style.transform = 'rotateY(90deg)';
                    } else {
                        next.style.transform = 'rotateY(-90deg)';
                    }
                    next.style.opacity = '0';

                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            next.classList.add('active');
                            next.style.transform = '';
                            next.style.opacity = '';
                            next.scrollTop = 0;
                        });
                    });
                }

                current = num;
                updateUI();
            }, 320);
        }

        function updateUI() {
            document.getElementById('counter').textContent = `${current} / ${TOTAL}`;
            document.getElementById('btn-prev').disabled = (current <= 1);
            document.getElementById('btn-next').disabled = (current >= TOTAL);
        }

        function prevPage() { if (current > 1) goTo(current - 1); }
        function nextPage() { if (current < TOTAL) goTo(current + 1); }

        // Keyboard nav
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft')  prevPage();
        });

        // Swipe support for mobile
        let touchStartX = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].clientX;
        }, { passive: true });
        document.addEventListener('touchend', e => {
            const diff = touchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextPage();
                else prevPage();
            }
        }, { passive: true });
    </script>
